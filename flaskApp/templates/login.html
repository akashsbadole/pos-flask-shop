{% extends "base.html" %}

{% block title %}Login - POS System{% endblock %}

{% block head %}
<style>
    body {
        background-color: #f8f9fa;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    /* Header */
    .header {
        background-color: #007bff;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        color: #fff;
    }
    .header img {
        height: 40px;
        margin-right: 10px;
    }
    .header h2 {
        font-size: 1.2rem;
        margin: 0;
        font-weight: 500;
    }

    /* Centered login box */
    .login-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .login-card {
        background: #fff;
        padding: 30px 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 360px;
        text-align: center;
    }
    .login-card h1 {
        font-size: 1.4rem;
        margin-bottom: 8px;
        font-weight: 600;
    }
    .login-card p {
        font-size: 0.9rem;
        color: #6c757d;
        margin-bottom: 20px;
    }
    .form-floating {
        margin-bottom: 15px;
        text-align: left;
    }
    .form-control {
        font-size: 0.95rem;
        padding: 10px;
        border-radius: 8px;
    }
    .btn-login {
        width: 100%;
        padding: 10px;
        font-size: 1rem;
        font-weight: 500;
        border-radius: 8px;
    }

    /* Footer */
    .footer {
        background-color: #f1f1f1;
        text-align: center;
        padding: 10px;
        font-size: 0.85rem;
        color: #6c757d;
    }
</style>
{% endblock %}

{% block content %}
<!-- Header -->
<div class="header">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
    <h2>POS System</h2>
</div>

<!-- Login -->
<div class="login-container">
    <div class="login-card">
        <h1>Welcome Back</h1>
        <p>Please sign in to continue</p>

        <form method="post">
            <div class="form-floating">
                <input type="text" class="form-control" id="username" name="username" placeholder="Username" required autofocus>
                <label for="username">Username</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                <label for="password">Password</label>
            </div>
            <button class="btn btn-primary btn-login" type="submit">Sign in</button>
        </form>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    &copy; 2023 POS System | My Business Pvt Ltd
</div>
{% endblock %}
