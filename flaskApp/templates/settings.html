{% extends "base.html" %}

{% block title %}Settings - POS System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Business Settings</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" action="{{ url_for('settings') }}">
            <div class="mb-3">
                <label for="businessName" class="form-label">Business Name *</label>
                <input type="text" class="form-control" id="businessName" name="name" value="{{ settings.name }}" required>
            </div>
            
            <div class="mb-3">
                <label for="businessAddress" class="form-label">Address</label>
                <textarea class="form-control" id="businessAddress" name="address" rows="2">{{ settings.address or '' }}</textarea>
            </div>
            
            <div class="mb-3">
                <label for="businessPhone" class="form-label">Phone</label>
                <input type="text" class="form-control" id="businessPhone" name="phone" value="{{ settings.phone or '' }}">
            </div>
            
            <div class="mb-3">
                <label for="businessEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="businessEmail" name="email" value="{{ settings.email or '' }}">
            </div>
            
            <div class="mb-3">
                <label for="taxId" class="form-label">Tax ID</label>
                <input type="text" class="form-control" id="taxId" name="tax_id" value="{{ settings.tax_id or '' }}">
            </div>
            
            <div class="mb-3">
                <label for="currency" class="form-label">Currency</label>
                <select class="form-select" id="currency" name="currency">
                    <option value="₹" {{ 'selected' if settings.currency == '₹' else '' }}>₹ (Rupee)</option>
                    <option value="$" {{ 'selected' if settings.currency == '$' else '' }}>$ (Dollar)</option>
                    <option value="€" {{ 'selected' if settings.currency == '€' else '' }}>€ (Euro)</option>
                    <option value="£" {{ 'selected' if settings.currency == '£' else '' }}>£ (Pound)</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="receiptFooter" class="form-label">Receipt Footer</label>
                <textarea class="form-control" id="receiptFooter" name="receipt_footer" rows="2">{{ settings.receipt_footer or '' }}</textarea>
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="taxInclusive" name="tax_inclusive" {{ 'checked' if settings.tax_inclusive else '' }}>
                <label class="form-check-label" for="taxInclusive">
                    Tax Inclusive Pricing
                </label>
            </div>
            
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="submit" class="btn btn-primary">Save Settings</button>
            </div>
        </form>
    </div>
</div>

<!-- AI Settings Section -->
<div class="card mt-4">
    <div class="card-header">
        <h5>AI Settings</h5>
    </div>
    <div class="card-body">
        <form method="post" action="{{ url_for('ai_settings') }}">
            <div class="mb-3">
                <label for="n8nWebhookUrl" class="form-label">n8n Webhook URL</label>
                <input type="text" class="form-control" id="n8nWebhookUrl" name="n8n_webhook_url" value="{{ settings.get('n8n_webhook_url', '') }}">
            </div>
            
            <div class="mb-3">
                <label for="n8nApiKey" class="form-label">n8n API Key</label>
                <input type="password" class="form-control" id="n8nApiKey" name="n8n_api_key" value="{{ settings.get('n8n_api_key', '') }}">
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="aiEnabled" name="ai_enabled" {{ 'checked' if settings.get('ai_enabled', True) else '' }}>
                <label class="form-check-label" for="aiEnabled">
                    Enable AI Features
                </label>
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="forecastingEnabled" name="forecasting_enabled" {{ 'checked' if settings.get('forecasting_enabled', True) else '' }}>
                <label class="form-check-label" for="forecastingEnabled">
                    Enable Sales Forecasting
                </label>
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="anomalyDetectionEnabled" name="anomaly_detection_enabled" {{ 'checked' if settings.get('anomaly_detection_enabled', True) else '' }}>
                <label class="form-check-label" for="anomalyDetectionEnabled">
                    Enable Anomaly Detection
                </label>
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="automatedReportsEnabled" name="automated_reports_enabled" {{ 'checked' if settings.get('automated_reports_enabled', True) else '' }}>
                <label class="form-check-label" for="automatedReportsEnabled">
                    Enable Automated Reports
                </label>
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="predictiveInventoryEnabled" name="predictive_inventory_enabled" {{ 'checked' if settings.get('predictive_inventory_enabled', True) else '' }}>
                <label class="form-check-label" for="predictiveInventoryEnabled">
                    Enable Predictive Inventory
                </label>
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="voiceCommandsEnabled" name="voice_commands_enabled" {{ 'checked' if settings.get('voice_commands_enabled', True) else '' }}>
                <label class="form-check-label" for="voiceCommandsEnabled">
                    Enable Voice Commands
                </label>
            </div>
            
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="submit" class="btn btn-primary">Save AI Settings</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
